general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Descargas/wallhaven-7jjz9o.png
    blur_passes = 4
    blur_size = 8
    brightness = 0.85
    vibrancy = 0.25
}

# ── Hora (arriba) ──
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = rgba(0, 0, 0, 0.65)
    font_size = 170
    font_family = Nunito Black
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 170
    halign = center
    valign = center
}

# ── Minutos (abajo) ──
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = rgba(255, 249, 220, 1.0)
    font_size = 170
    font_family = Nunito Black
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 0
    halign = center
    valign = center
}

# ── Fecha (arriba izquierda) ──
label {
    monitor =
    text = cmd[update:60000] date +"%d %b %A"
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = Nunito Bold
    position = 25, -20
    halign = left
    valign = top
}

# ── Sensación térmica (arriba derecha) ──
label {
    monitor =
    text = cmd[update:600000] echo "Feels like $(curl -s 'wttr.in/Santiago?format=%f&m')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = Nunito Bold
    position = -25, -20
    halign = right
    valign = top
}

# ── Avatar ──
image {
    monitor =
    path = ~/home/text0/Descargas/back.jpg
    size = 110
    rounding = -1            # -1 = círculo perfecto
    border_size = 3
    border_color = rgba(255, 249, 220, 0.9)
    position = 0, 250
    halign = center
    valign = bottom
}

# ── Nombre de usuario ──
label {
    monitor =
    text = $USER
    color = rgba(255, 249, 220, 1.0)
    font_size = 22
    font_family = Nunito Black
    shadow_passes = 2
    shadow_size = 3
    position = 0, 190
    halign = center
    valign = bottom
}

# ── Campo de contraseña ──
input-field {
    monitor =
    size = 260, 50
    rounding = -1
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.65)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 249, 220, 1.0)
    check_color = rgba(243, 217, 139, 1.0)
    fail_color = rgba(255, 90, 90, 1.0)
    capslock_color = rgba(255, 170, 60, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, 110
    halign = center
    valign = bottom
}

# ── Canción actual ──
label {
    monitor =
    text = cmd[update:1000] /home/text0/.config/hypr/song.sh
    color = rgba(255, 255, 255, 0.95)
    font_size = 15
    font_family = Nunito Bold
    position = 0, 40
    halign = center
    valign = bottom
}
